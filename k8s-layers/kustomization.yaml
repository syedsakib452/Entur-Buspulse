apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - bronze-cronjob.yaml
  - silver-cronjob.yaml
  - gold-cronjob.yaml
# For a fixed version, replace latest with the sha-xxxxxxx tag from the GitHub Actions run summary.
images:
  - name: ghcr.io/syedsakib452/entur-buspulse-bronze
    newTag: latest
  - name: ghcr.io/syedsakib452/entur-buspulse-silver
    newTag: latest
  - name: ghcr.io/syedsakib452/entur-buspulse-gold
    newTag: latest
