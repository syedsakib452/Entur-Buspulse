# GOLD layer: silver days marked done -> gold tables (DuckDB)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gold-layer
  namespace: buspulse-tables
  labels: { app: buspulse-layers, layer: gold }
spec:
  schedule: "40 19 * * *"           # 19:40 UTC: after silver; does nothing if silver has not changed
  concurrencyPolicy: Forbid          # never two gold runs at once
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1                 # a rerun only redoes days without a done marker
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels: { app: buspulse-layers, layer: gold }
        spec:
          restartPolicy: Never
          containers:
            - name: gold
              image: ghcr.io/syedsakib452/entur-buspulse-gold   # tag set in kustomization.yaml
              imagePullPolicy: Always
              envFrom:
                - configMapRef: { name: layers-config }
                - secretRef: { name: swift-credentials }
              resources:
                requests: { cpu: "500m", memory: 512Mi }
                limits: { cpu: "1", memory: 1536Mi }
              volumeMounts:
                - { name: work, mountPath: /work }
          volumes:
            - name: work
              emptyDir: { sizeLimit: 5Gi }   # scratch space, deleted with the pod
