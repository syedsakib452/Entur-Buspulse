# Settings shared by the three layer jobs. Each job reads only what it needs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: layers-config
  namespace: buspulse-tables
data:
  OS_AUTH_URL: "https://REPLACE-ME/v3"     # same value as in the collectors' configuration
  RAW_BUCKET: buspulse-raw
  BRONZE_BUCKET: buspulse-bronze
  SILVER_BUCKET: buspulse-silver
  GOLD_BUCKET: buspulse-gold
  # days to process; empty END_DATE = yesterday (bronze/silver) or today (gold). Done days are skipped.
  START_DATE: "2026-10-20"
  END_DATE: ""
  # a UTC day is built only this many hours after it ended (collectors finish uploading first)
  SETTLE_HOURS: "3"
  # silver of day D starts only this many hours after bronze of D+1 finished
  SILVER_DELAY_HOURS: "12"
  # "true" = rebuild START_DATE..END_DATE even if marked done (after a fix); set back to "" afterwards
  REDO: ""
  # Spark in local mode inside one pod (bronze and silver)
  SPARK_MASTER: "local[2]"
  SPARK_DRIVER_MEMORY: "1400m"
  SPARK_SHUFFLE_PARTITIONS: "16"
  SPARK_LOCAL_DIR: /work/spark
  SWIFT_CACHE_DIR: /work/swift
  KEEP_BUILDS: "3"
