# Builds the image for the bronze + silver batch job (tables/) and publishes it to
# GitHub Container Registry, separate from the collectors' image:
#   ghcr.io/<owner>/entur-buspulse-tables:sha-<commit>   (pin this in k8s-tables/kustomization.yaml)
#   ghcr.io/<owner>/entur-buspulse-tables:latest
name: build-tables-image

on:
  push:
    branches: [main]
    paths: ["tables/**", ".github/workflows/build-tables-image.yml"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the Python code compiles
        run: python -m compileall -q tables/build_bronze_tables.py tables/build_silver_tables.py tables/run_days.py

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-tables
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: tables
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
