# Compile check for the Python code.
# The VM deploy job was removed: the collectors run on Kubernetes now
# (see k8s/README.md). Docker Compose (compose.yaml) is kept for local development.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Check the Python code compiles
        run: |
          pip install -r requirements.txt
          python -m compileall -q common collectors
