name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Check the Python code compiles
        run: |
          pip install -r requirements.txt
          python -m compileall -q common collectors

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Update code on the VM
        run: |
          cd /home/ubuntu/buspulse
          git fetch origin main
          git reset --hard origin/main
          echo "VM now at commit: $(git rev-parse --short HEAD)"

      - name: Rebuild and restart containers
        run: |
          cd /home/ubuntu/buspulse
          docker compose build
          docker compose up -d --no-build
          docker compose ps
          docker image prune -f