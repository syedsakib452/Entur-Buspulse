# Tests the code, then builds one image per layer:
#   ghcr.io/<owner>/entur-buspulse-bronze | -silver | -gold   (tags sha-<commit> and latest)
# The VM pulls these with analysis/scripts/run-pipeline.sh.
name: build-layer-images

on:
  push:
    branches: [main]
    paths:
      - "analysis/bronze-layer/**"
      - "analysis/silver-layer/**"
      - "analysis/gold/**"
      - ".github/workflows/build-layer-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-layer-images
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install -r analysis/silver-layer/requirements.txt -r analysis/bronze-layer/requirements.txt -r analysis/gold/requirements.txt pytest
      - name: Silver tests
        run: PYTHONPATH=analysis/silver-layer python -m pytest analysis/silver-layer/spark_jobs/tests -q
      - name: All entrypoints compile
        run: |
          python -m py_compile \
            analysis/bronze-layer/build_bronze_tables.py \
            analysis/bronze-layer/run_bronze_range.py \
            analysis/gold/run_gold.py \
            analysis/gold/build_gold.py

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { layer: bronze, dockerfile: analysis/bronze-layer/Dockerfile }
          - { layer: silver, dockerfile: analysis/silver-layer/Dockerfile }
          - { layer: gold,   dockerfile: analysis/gold/Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/entur-buspulse-${{ matrix.layer }}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: analysis          # the Dockerfiles COPY bronze-layer/..., silver-layer/..., gold/...
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ steps.name.outputs.tag }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.layer }}
          cache-to: type=gha,mode=max,scope=${{ matrix.layer }}
      - name: Summary
        run: |
          echo "${{ matrix.layer }} image: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
