# One container per collector, so each runs (and fails/restarts) independently.
#   docker compose up -d --build              start all
#   docker compose stop service_alerts        stop one
#   docker compose logs -f vehicle_positions  follow one

x-collector: &collector
  image: buspulse-collectors
  restart: unless-stopped
  volumes:
    - ./data:/data
    - ./logs:/logs

services:
  estimated_timetable:
    <<: *collector
    build: .
    command: collectors.estimated_timetable

  service_alerts:
    <<: *collector
    command: collectors.service_alerts

  vehicle_positions:
    <<: *collector
    command: collectors.vehicle_positions

  static_timetable:
    <<: *collector
    command: collectors.static_timetable
    
  uploader:
    build: ./uploader
    image: buspulse-uploader
    profiles: ["jobs"]
    env_file: ${HOME}/openstack.env   # OS_* login, kept outside the repo
    environment:
      SWIFT_CONTAINER: buspulse-raw
      DELETE_LOCAL: "true"            # "false" = upload but keep local files
    volumes:
      - ./data:/data
      - ./logs:/logs