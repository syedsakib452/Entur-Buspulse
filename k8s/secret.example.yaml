# TEMPLATE ONLY - do not put real values here and do not apply this file.
# The real Secret is created from a git-ignored env file, see k8s/README.md:
#   kubectl create secret generic openstack-credentials -n buspulse --from-env-file=<file>
# Keys are the OS_* variables from an OpenStack application credential RC file.
apiVersion: v1
kind: Secret
metadata:
  name: openstack-credentials
  namespace: buspulse
type: Opaque
stringData:
  OS_AUTH_TYPE: "v3applicationcredential"
  OS_AUTH_URL: "http://cloud.cs.ux.uis.no:5000/v3/"
  OS_IDENTITY_API_VERSION: "3"
  OS_REGION_NAME: "RegionOne"
  OS_INTERFACE: "public"
  OS_APPLICATION_CREDENTIAL_ID: "<id>"
  OS_APPLICATION_CREDENTIAL_SECRET: "<secret>"
