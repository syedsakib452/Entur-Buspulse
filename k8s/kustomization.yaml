# Lets you apply everything with one command:  kubectl apply -k k8s/
# The image version is set here, in one place. It is pinned to a fixed build (sha-<commit>),
# so a pod restart never picks up code that was not deliberately deployed.
# To deploy a new version: set newTag to the sha-<commit> tag of a green build-image run,
# commit, then: kubectl apply -k k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - vehicle-positions.yaml
  - estimated-timetable.yaml
  - service-alerts.yaml
  - static-timetable.yaml
images:
  - name: ghcr.io/syedsakib452/entur-buspulse
    newTag: sha-48ed42b
