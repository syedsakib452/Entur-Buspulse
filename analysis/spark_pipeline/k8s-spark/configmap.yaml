apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-pipeline-config
  namespace: buspulse-tables
data:
  # Swift's S3 API (step 1 of the README finds the right value)
  S3_ENDPOINT: "https://REPLACE-ME"
  RAW_BUCKET: buspulse-raw
  BRONZE_BUCKET: buspulse-bronze
  SILVER_BUCKET: buspulse-silver
  # days to process; empty END_DATE = yesterday (UTC). Days already done are skipped.
  START_DATE: "2026-10-20"
  END_DATE: ""
  STAGES: "bronze clean stop_analysis"
  # a UTC day is built only this many hours after it ended (collectors finish uploading first)
  SETTLE_HOURS: "3"
  # "true" = rebuild START_DATE..END_DATE even if marked done (after a fix); set back to "" afterwards
  REDO: ""
  # Spark in local mode inside one pod: 2 cores, 1.4 GB heap, spills to /work
  SPARK_MASTER: "local[2]"
  SPARK_DRIVER_MEMORY: "1400m"
  SPARK_SHUFFLE_PARTITIONS: "16"
  SPARK_LOCAL_DIR: /work/spark
