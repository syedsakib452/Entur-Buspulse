# Do NOT commit a filled-in copy. Create the Secret with kubectl instead (see README step 7).
apiVersion: v1
kind: Secret
metadata:
  name: swift-credentials
  namespace: buspulse-tables
type: Opaque
stringData:
  OS_USERNAME: "<OpenStack username>"
  OS_PASSWORD: "<OpenStack password>"
  OS_PROJECT_NAME: "<OpenStack project>"
  OS_USER_DOMAIN_NAME: "<user domain>"
  OS_PROJECT_DOMAIN_NAME: "<project domain>"
  # For application credentials, use these instead of username/password:
  # OS_AUTH_TYPE: v3applicationcredential
  # OS_APPLICATION_CREDENTIAL_ID: "<application credential ID>"
  # OS_APPLICATION_CREDENTIAL_SECRET: "<application credential secret>"
