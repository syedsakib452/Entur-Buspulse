# Silver layer container using local date-first tables:
#   reads <repo>/tables/bronze/<date>/<table>.parquet
#   writes <repo>/tables/silver/<date>/<table>.parquet
name: buspulse-silver

services:
  silver:
    build:
      context: ../..
      dockerfile: analysis/silver-layer/Dockerfile
    image: buspulse-silver:local
    entrypoint: ["tini", "--", "bash", "/app/run_silver_loop.sh"]
    restart: unless-stopped
    environment:
      - TABLES_DIR=/data/tables
      - DATA_ROOT=/work/runtime
      - SILVER_LOCAL_DIR=/data/tables/silver
      - START_DATE=${START_DATE:-2026-10-20}
      - END_DATE=${END_DATE:-}
      - REDO=${REDO:-}
      - CHECK_EVERY_MINUTES=${CHECK_EVERY_MINUTES:-60}
      - RUN_ONCE=${RUN_ONCE:-}
      - SPARK_MASTER=local[2]
      - SPARK_DRIVER_MEMORY=1400m
      - SPARK_SHUFFLE_PARTITIONS=16
    volumes:
      - ../../tables:/data/tables
      - silver-work:/work
    mem_limit: 3g
    cpus: 2
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  silver-work:
