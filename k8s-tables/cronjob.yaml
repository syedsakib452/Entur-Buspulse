# Bronze + silver batch job: every night it builds the tables for every finished day that is
# not in buspulse-silver yet (normally just yesterday). The first run backfills all days since
# START_DATE, which takes many hours, hence the long deadline.
# Reads buspulse-raw, writes buspulse-bronze and buspulse-silver. Does not touch the collectors.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bronze-silver
  namespace: buspulse-tables
  labels: {app: bronze-silver}
spec:
  schedule: "0 4 * * *"          # 04:00 UTC, after the 03:00 static-timetable job
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid      # never two runs at once
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1                 # one retry; finished days are skipped on retry
      activeDeadlineSeconds: 172800   # stop a run after 48 h (the first backfill is long)
      template:
        metadata:
          labels: {app: bronze-silver}
        spec:
          restartPolicy: Never        # failed pods are kept, so their logs can be read
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000             # makes /work writable for that user
          containers:
            - name: tables
              image: ghcr.io/syedsakib452/entur-buspulse-tables
              imagePullPolicy: IfNotPresent   # tag is pinned in kustomization.yaml
              envFrom:
                - configMapRef: {name: tables-settings}
                - secretRef: {name: openstack-credentials}
              volumeMounts:
                - {name: work, mountPath: /work}
              resources:
                requests: {cpu: 250m, memory: 1Gi}
                limits: {cpu: "1", memory: 2Gi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
          volumes:
            - name: work                # temporary Parquet files, deleted with the pod
              emptyDir:
                sizeLimit: 5Gi
