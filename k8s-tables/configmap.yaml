# Settings for the bronze + silver job (read by tables/run_days.py).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tables-settings
  namespace: buspulse-tables
data:
  START_DATE: "2026-10-20"     # first day to process
  END_DATE: "2026-10-21"       # last day; set to "" to process up to yesterday (UTC)
  WORKERS: "4"                 # parallel downloads from Swift in the bronze step
  TMPDIR: "/work"              # temporary Parquet files (emptyDir volume)
  HOME: "/tmp"                 # writable home for the non-root user
