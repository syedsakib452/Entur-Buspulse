# Bronze + silver batch job, separate from the collectors (k8s/).
#   kubectl apply -k k8s-tables/
# The image is pinned: set newTag to the sha-<commit> tag of a green build-tables-image run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - cronjob.yaml
images:
  - name: ghcr.io/syedsakib452/entur-buspulse-tables
    newTag: sha-CHANGEME
